# @package _global_
# =============================================================================
# XqRobotWL 双轮腿机器人 PPO 粗糙地形训练配置 (MuJoCo 后端)
# 地形: 多类型混合 (楼梯/随机粗糙/波浪/斜坡)
# 改进: 动作平滑 + 地形课程 + 观测归一化 + 碰撞力检测
# 楼梯特化训练: 见 conf/np3o/task/xqrobotwl_stairs/
# =============================================================================
training:
  task_name: XqRobotWLWalkRough
  sim_backend: mujoco
  play_steps: 500
  play_env_num: 16
  render_spacing: 0.0
  cam_tracking: true
  cam_tracking_env_idx: 0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  use_env_visual_model: false

algo:
  num_envs: 1024
  num_steps_per_env: 25
  max_iterations: 10000
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.002
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.005
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.35
    wheel_action_scale: 8.0
    clip_actions: 100.0
    action_smoothing: 0.2
  max_episode_seconds: 10.0
  commands:
    vel_limit:
      - [-1.0, 0.0, -1.5, -0.1]
      - [1.0, 0.0, 1.5, 0.1]
    resampling_time: 6.0
  terrain_scan:
    enabled: true
    hfield_name: terrain_hfield
    geom_name: floor
  terrain_curriculum:
    enabled: true
    promote_frac: 0.5
    demote_frac: 0.25
    cycle_top_frac: 0.5
  termination_config:
    terrain_out_of_bounds: true
    terrain_distance_buffer: 3.0
  domain_rand:
    randomize_base_mass: true
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: true
    randomize_leg_length: false
  curriculum:
    enabled: true
    vel_step: 0.001
    ang_vel_step: 0.002
    min_vel_range_frac: 0.3
    min_ang_range_frac: 0.05
    update_interval: 25
    err_threshold: 0.35

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 4.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.02
    base_height: -30.0
    orientation: -8.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.005
    similar_calf: -1.0
    hip_roll: -4.0
    wheel_symmetry: -0.5
    tsk: -2.0
    feet_distance: -1.0
    collision: -1.0
    alive: 2.0
  tracking_sigma: 0.15
  base_height_target: 0.55
  max_tilt_deg: 60.0
  min_base_height: 0.20
