# @package _global_
# =============================================================================
# XqRobotWL 点足行走 PPO — 相位门控模式 (无参考轨迹)
# 相位 0-2π: 左摆(0-π) 右摆(π-2π), 只奖行为结果, 策略自由探索步态
# =============================================================================
training:
  task_name: XqRobotWLToeWalkFlat
  sim_backend: mujoco
  play_steps: 600
  play_env_num: 1

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.4
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.005
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.005
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.18  # 缩小步长, 平缓动作
    wheel_action_scale: 10.0
    clip_actions: 100.0
  max_episode_seconds: 10.0
  commands:
    vel_limit:
      - [-0.3, -0.1, -0.3, -0.1]
      - [0.3, 0.1, 0.3, 0.1]
    resampling_time: 6.0
  curriculum:
    enabled: true
    vel_step: 0.001
    ang_vel_step: 0.002
    min_vel_range_frac: 0.3
    min_ang_range_frac: 0.05
    update_interval: 25
    err_threshold: 0.35
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 4.0
    tracking_ang_vel: 2.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.3
    base_height: -100.0  # 强惩罚但不致死 (0.50m=-0.25, 0.35m=-4.0)
    orientation: -30.0
    joint_action_rate: -0.08  # 加倍惩罚关节急变
    wheel_action_rate: -0.001
    leg_mirror: -0.2
    tsk: -2.0
    hip_roll: -0.5
    alive: 1.0
    phase_swing_lift: 30.0
    phase_knee_lift: 15.0
    phase_knee_stance: 5.0
    phase_stance_penalty: 5.0
    swing_contact_penalty: 5.0
    feet_regulation: 2.0
  tracking_sigma: 0.3
  base_height_target: 0.55
  cycle_time: 0.7
  use_reference: false
  max_tilt_deg: 90.0
  min_base_height: 0.15
