# @package _global_
# =============================================================================
# XqRobotWL 点足行走 PPO — 单模式 (相位门控, v11: 老板验收版)
# 目标: 原地小踏步点足 — 平缓/小幅度/一左一右/机身高度正常 (不前进)
#   * 平衡预热: 前 1200 iter 无抬腿奖励、只学站立保持 (解决 v10 从零学必崩)
#   * 窗级交替考核: 未离地窗轻罚(60→300 课程) + 逐时密集离地奖 30 → 一左一右
#   * 小幅抬腿: action_scale 0.18 + knee 弯幅上限 clip(0.5) + joint_action_rate
#   * 高度: base_height_target 0.55 / base_height -150 (老板: 高度不够要修正)
#   * 原地踏步: tracking 0 (不做行走追踪)
#   * 终止放宽: thigh ±0.9 + 异常帧延迟 5 (探索不误杀)
# =============================================================================
training:
  task_name: XqRobotWLToeWalkFlat
  sim_backend: mujoco
  play_steps: 600
  play_env_num: 1

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.005
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.005
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.18  # v11: 小步长 → 平缓抬腿
    wheel_action_scale: 10.0
    clip_actions: 100.0
  max_episode_seconds: 10.0
  commands:
    vel_limit:
      - [-0.3, -0.1, -0.3, -0.1]
      - [0.3, 0.1, 0.3, 0.1]
    resampling_time: 10.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false

reward:
  only_positive_rewards: false
  scales:
    # ── 站立保持 (预热 + 全程) ──
    tracking_lin_vel: 0.0    # v11: 原地踏步, 不做行走追踪
    tracking_ang_vel: 0.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.3
    base_height: -150.0      # v11: 高度惩罚加强 (-60→-150), 目标 0.55 → 解决"高度不够"
    orientation: -30.0
    joint_action_rate: -0.08 # 平滑
    wheel_action_rate: -0.002
    leg_mirror: -0.2
    tsk: -2.0
    hip_roll: -0.5
    alive: 1.0
    # ── 抬腿: 小额 + 窗级交替 ──
    ref_tracking: 20.0        # v13: 参考轨迹跟踪 (正弦左右交替, 小幅)
    swing_lift: 10.0          # v13: 辅助离地 (参考模式口径)
    phase_knee_stance: 5.0
    phase_stance_penalty: 5.0
    window_lift: 0.0
    window_penalty: 0.0       # v12: 关闭窗级罚 (多轮实证窗罚在探索期压死学习)
    lift_symmetry: -20.0      # v12: 对称 EMA 修正单侧偏 (周期级)
    feet_regulation: 2.0
  tracking_sigma: 0.3
  base_height_target: 0.55
  cycle_time: 0.7
  use_reference: true      # v13: 正弦参考轨迹强制左右交替
  ref_scale: 0.15            # v13b: 幅度 0.15 (0.08 不足离地, 0.18 v1 曾成功; 0.15 仍算小幅)
  max_tilt_deg: 90.0
  min_base_height: 0.15
  curriculum_steps: 1200      # 参考模式不依赖预热 (保留字段)
  symmetry_decay: 0.98