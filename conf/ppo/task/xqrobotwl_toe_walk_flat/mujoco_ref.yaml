# @package _global_
# =============================================================================
# XqRobotWL 点足行走 PPO 训练 (正弦轨迹跟踪 + 速度跟踪)
# 时钟驱动交替迈步参考轨迹, RL 学习跟踪+修正
# Stage 2: 边迈步边移动
# =============================================================================
training:
  task_name: XqRobotWLToeWalkFlat
  sim_backend: mujoco
  play_steps: 600
  play_env_num: 1

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.002
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.005
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.5
    wheel_action_scale: 10.0
    clip_actions: 100.0
  max_episode_seconds: 10.0
  commands:
    vel_limit:
      - [-0.3, -0.1, -0.3, -0.1]
      - [0.3, 0.1, 0.3, 0.1]
    resampling_time: 6.0
  curriculum:
    enabled: true
    vel_step: 0.001
    ang_vel_step: 0.002
    min_vel_range_frac: 0.3
    min_ang_range_frac: 0.05
    update_interval: 25
    err_threshold: 0.35
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 4.0
    tracking_ang_vel: 2.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -60.0
    orientation: -10.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.005
    leg_mirror: -0.5
    tsk: -2.0
    hip_roll: -2.0
    wheel_symmetry: -0.5
    feet_distance: -1.0
    alive: 1.0
    ref_tracking: 2.0
    swing_lift: 5.0
    wheel_balance: 3.0
  tracking_sigma: 0.3
  base_height_target: 0.55
  cycle_time: 0.7
  ref_scale: 0.18
  max_tilt_deg: 45.0
  min_base_height: 0.15
