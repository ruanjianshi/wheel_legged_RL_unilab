# @package _global_
# =============================================================================
# XqRobotWL 双轮腿机器人 PPO 跳跃训练配置 (MuJoCo 后端)
# 5D 命令: [vx, vy, vyaw, tsk, jump_trigger]
#   jump_trigger > 0.5 时触发跳跃: 下蹲 → 爆发伸展 → 腾空 → 着陆
# =============================================================================
# =============================================================================
training:
  task_name: XqRobotWLJumpFlat
  sim_backend: mujoco
  play_steps: 300
  play_env_num: 1
  render_spacing: 0.0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0
  camera_elevation: -15.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.004  # 中度探索: 0.005过度探索落地乱, 0.002太保守不学跳
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.6
    wheel_action_scale: 10.0
    clip_actions: 100.0
  commands:
    vel_limit:
      - [-0.3, 0.0, -0.5, -0.1, 0]
      - [0.3, 0.0, 0.5, 0.1, 1]
    resampling_time: 4.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -60.0
    orientation: -5.0
    joint_action_rate: -0.15  # 反空中蹬腿乱动 (旧 -0.1: 火箭策略空中扇腿免罚)
    wheel_action_rate: -0.02
    leg_mirror: -12.0
    tsk: -2.0
    alive: 1.0
    jump_height: 30.0  # 强化跳跃激励: 腾空最高 ~60/步 (改 15→30, 让"受控跳"跑赢"火箭/原地拉伸")
    crouch_prep: 4.0
    landing_soft: 30.0  # 门控后只在真实腾空落地后 ~10 步激活 (原40白嫖: 站着不动也拿)
    landing_recovery: 10.0  # 强化落地恢复 (原4): 高速落地后恢复直立
    wheel_air_time: 30.0
    launch_rise: 20.0  # 实际升高奖励 (40→20): 旧阈值下 40 驱动"火箭发射"行为 (飞到3m 不落地)
    crouch_depth: 8.0  # 深蹲回报 (原4): 逼出"先蹲后蹬" (窗口内 base_height 已归零不罚款)
    anti_loiter: 12.0  # 增强: 跳完后逼机器人站起来
    lean_forward: 5.0
    anti_lazy: 60.0  # 反惰性: 触发窗口内膝盖幅值<0.5rad 重罚, 逼真实蹲-蹬 (破"缓慢站起"局部最优)
  tracking_sigma: 0.3
  base_height_target: 0.55
  jump_height_target: 1.0
  crouch_height_target: 0.40
  max_tilt_deg: 45.0
  min_base_height: 0.15
  # 跳跃课程: [start, end] 环境步数, 线性 ramp jump_trigger + 跳跃奖励权重
  # 24_576 步/iter (1024 envs × 24 steps)
  jump_curriculum_start: 0
  jump_curriculum_end: 0  # 对比公平: 四版本统一无热身, 立即全开跳跃
  landing_window: 10  # 真实腾空落地后 landing_soft 奖励步数 (白嫖防护)
