# @package _global_
# =============================================================================
# XqRobotWL Wheeled-SRL 跳跃训练配置 (MuJoCo 后端)
# 5D 命令: [vx, vy, vyaw, tsk, jump_trigger]
#
# Wheeled-SRL 改进:
# - SLIP模型六状态FSM前馈 + PPO反馈融合
# - 轮地速度匹配奖励 (替代 wheel_air_time)
# - 扩展观测含 fsm_state + jump_phase
# =============================================================================
training:
  task_name: XqRobotWLJumpFlat
  sim_backend: mujoco
  play_steps: 300
  play_env_num: 1
  render_spacing: 0.0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0
  camera_elevation: -15.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3       # 0.5→0.3 限制初始探索
  algorithm:
    learning_rate: 1.0e-4     # 稳定
    entropy_coef: 0.008       # 0.005→0.008 微增，适当鼓励收敛
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01          # 回退到稳定值
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.7             # 回退到稳定值
    wheel_action_scale: 10.0
    clip_actions: 100.0
  commands:
    vel_limit:
      - [-0.3, 0.0, -0.5, -0.1, 0]
      - [0.3, 0.0, 0.5, 0.1, 1]
    resampling_time: 4.0
  curriculum:
    enabled: false             # 先关闭，减少变量
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false

reward:
  only_positive_rewards: false # 回退 — 负面惩罚是必要反馈
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -2.0          # -5.0→-2.0 降低站立约束
    orientation: -2.0          # -5.0→-2.0
    joint_action_rate: -0.1    # 回退
    wheel_action_rate: -0.015
    leg_mirror: -2.0            # -0.5→-2.0 强对称约束
    tsk: -2.0
    alive: 1.0                 # 0.5→1.0 回退，先保证存活
    jump_height: 20.0          # 12.0→20.0
    crouch_prep: 6.0
    landing_soft: 4.0
    wheel_ground_matching: 20.0 # 15.0→20.0
    vertical_thrust: 12.0
    crouch_depth: 6.0
    action_magnitude: -0.02    # ★ 惩罚大动作，促使策略收敛
  tracking_sigma: 0.3
  base_height_target: 0.65
  jump_height_target: 1.0
  crouch_height_target: 0.40
  max_tilt_deg: 45.0
  min_base_height: 0.15
  # 分阶段训练: 前 N 个迭代只站立 (jump_trigger=0)，之后逐步引入跳跃
  jump_warmup_steps: 3000
