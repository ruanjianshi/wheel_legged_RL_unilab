# @package _global_
# =============================================================================
# XqRobotWL SRL+VMC 跳跃训练配置 (MuJoCo 后端)
# SLIP-FSM 六状态前馈提供每阶段虚拟腿长参考, VMC 转关节力矩, PPO 输出残差。
# 与 SRL 版本相同奖励/命令/预算, 仅控制层不同。
# =============================================================================
training:
  task_name: XqRobotWLJumpSRLVMC
  run_suffix: ""
  sim_backend: mujoco
  play_steps: 300
  play_env_num: 1
  render_spacing: 0.0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0
  camera_elevation: -15.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
    default:
      - policy
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.005
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.6
    wheel_action_scale: 10.0
    clip_actions: 1.0
    action_smoothing: 0.3  # v7c: 动作一阶低通 (jump_vmc.apply_action) — 压站立期高频摆动 (v7b 收敛后站立 |gyro| 2.25)
  commands:
    vel_limit:
      - [-0.3, 0.0, -0.5, -0.1, 0]
      - [0.3, 0.0, 0.5, 0.1, 1]
    resampling_time: 4.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false
  vmc:
    # 虚拟腿运动学 (标定自 tools/xqrobotwl/calibrate_xqrobotwl_vmc.py)
    l1: 0.30053
    l2: 0.30070
    offset: -0.00003
    theta0_offset: 0.0747
    l0_offset: 0.3669
    l0_min: 0.2047
    l0_max: 0.5231
    singularity_epsilon: 0.05
    hip_sign: [1.0, -1.0]
    knee_sign: [-1.0, 1.0]
    c1: 2.4103
    c2: -1.6790
    # VMC 增益
    kp_theta: 60.0
    kd_theta: 3.0
    kp_l0: 800.0
    kd_l0: 20.0  # v6: 8→12; v7d: 12→20 — 进一步增强腿长阻尼压站立振荡 (v7c 收敛后站立 |gyro| 3.06, 仍压不住)
    feedforward_force: 110.0  # 支撑前馈: 需 > 体重/腿(~91N), 否则无法起跳
    kp_roll: 40.0
    kd_roll: 2.0
    kp_wheel: 2.0
    kp_wheel_integral: 1.0
    wheel_integral_limit_ratio: 0.5
    wheel_ctrlrange: 10.0
    # 动作缩放
    action_scale_theta: 0.5
    action_scale_l0: 0.12  # 覆盖下蹲0.28~蹬伸0.50范围
    action_scale_vel: 10.0
    action_scale_roll: 0.3
    roll_default: [0.1, -0.1]
    wheel_sign: [1.0, -1.0]
    clip_actions: 1.0
    # SLIP-FSM 阶段腿长参考 (L0, m)
    crouch_length: 0.24  # v8d: 0.28→0.24 — 更深下蹲 → 更大蹬伸行程 → 更高跳跃
    thrust_length: 0.50
    flight_retract_length: 0.26
    prelanding_length: 0.42
    landing_absorption_length: 0.30
    prelanding_start_vz: 0.2   # 提前一点开始伸腿准备落地 (原 0.0)
    prelanding_full_vz: -0.6
    landing_compression_time: 0.12  # 压缩在 landing 阶段 0.15s 窗口内完成 (原 0.18)
    # FSM 阶段时长 (s): VMC 力控制比关节位置控制慢, 需更长下蹲/蹬伸窗口
    fsm_crouch_time: 0.50  # v8d: 0.45→0.50 — 更深下蹲需要更长压缩时间
    fsm_thrust_time: 0.30
    # 阶段相关 VMC 增益 (v8d: 加强蹬伸 — 干净消融证明 VMC 靠外展借力起跳,
    # 加回 lateral_posture 压外展后必须靠更强 L0 力控起跳)
    thrust_kp_scale: 3.0  # v8d: 2.5→3.0
    thrust_ff_scale: 3.5  # v8d: 2.5→3.5 (更强蹬伸前馈)
    thrust_kd_scale: 0.3  # v8d: 0.5→0.3 (更低阻尼, 更爆发)
    flight_ff_scale: 0.40
    landing_kd_scale: 3.0    # 落地吸收更高阻尼 (原 2.5)
    landing_ff_scale: 1.30   # 落地吸收更高前馈支撑 (原 1.2)

  # 落地恢复窗口 (ctrl 步): 真实落地后 landing_recovery/landing_soft 保持 0.5s
  landing_window: 50

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.5  # v8: 与 SRL 完全一致 (干净消融 — 只输出层不同)
    base_height: -60.0
    orientation: -5.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.015
    leg_mirror: -12.0
    tsk: -2.0
    alive: 1.0
    jump_height: 25.0  # v8: 与 SRL 一致 (v6 曾 30 强化)
    crouch_prep: 8.0
    landing_soft: 8.0  # v8: 与 SRL 一致 (v6 曾 4)
    landing_recovery: 8.0  # v8: 与 SRL 一致 (v6 曾 12); 奖励 fn 也用 SRL 的站立期恒开版
    wheel_ground_matching: 8.0  # v8: 与 SRL 一致 (v6 曾 20)
    vertical_thrust: 30.0
    crouch_depth: 4.0
    action_magnitude: -0.1
    anti_drift: -3.0  # v8: 补 SRL 有的项
    height_progress: 20.0  # v8: 与 SRL 一致 (v6 曾 25)
    lean_forward: 3.0
    lateral_posture: 15.0  # v8d: 加回跳跃期髋外展惩罚 (干净消融证实 VMC 靠外展借力, 压外展逼干净起跳)
    jump_event: 100.0  # v8e2: 真跳事件一次性奖励 (base_z 首次>0.72, 每窗口一次) — 引导策略跨过小跳局部最优
    jump_upright: 5.0  # v8e4: 12→5 — 高跳(0.28m)比低跳每步多赚~5 jump_height, 姿态过强会把跳高压下去 (v8e3 实测 0.283→0.166m); 调轻后跳高重新主导, 姿态仍比 v8e2 干净
    jump_symmetry: 2.0  # v8e4: 5→2 — 同上, 只保留轻微左右腿协调倾向
  tracking_sigma: 0.3
  base_height_target: 0.55
  jump_height_target: 1.0
  crouch_height_target: 0.40
  max_tilt_deg: 45.0
  min_base_height: 0.15
  jump_curriculum_start: 0
  jump_curriculum_end: 0  # 无预热, 直接全开跳跃
  feedback_gain: 0.35  # v4: 0.5→0.35 — 参考更主导, 防策略干扰破坏 FSM 蹲→蹬时序 (SRL+VMC 理论最优需参考主导)
  jump_event_threshold: 0.72  # v8e2: base_z 超过此值触发真跳事件奖励 (站立 ~0.55 + 0.17m)
  ablation_mode: full
