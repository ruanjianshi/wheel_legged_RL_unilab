# @package _global_
# =============================================================================
# XqRobotWL PPO+VMC 跳跃训练配置 (MuJoCo 后端)
# 与纯 PPO jump 相同的奖励/命令/预算, 但策略输出虚拟腿变量, 由 VMC 转关节力矩。
# 5D 命令: [vx, vy, vyaw, tsk, jump_trigger]
# 8D 动作: [roll_L, theta_L, L0_L, roll_R, theta_R, L0_R, wheel_L, wheel_R]
# =============================================================================
training:
  task_name: XqRobotWLJumpVMC
  sim_backend: mujoco
  play_steps: 300
  play_env_num: 1
  render_spacing: 0.0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0
  camera_elevation: -15.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.005
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.6
    wheel_action_scale: 10.0
    clip_actions: 1.0
  commands:
    vel_limit:
      - [-0.3, 0.0, -0.5, -0.1, 0]
      - [0.3, 0.0, 0.5, 0.1, 1]
    resampling_time: 4.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false
  vmc:
    # 虚拟腿运动学 (标定自 tools/xqrobotwl/calibrate_xqrobotwl_vmc.py)
    l1: 0.30053
    l2: 0.30070
    offset: -0.00003
    theta0_offset: 0.0747
    l0_offset: 0.3669
    l0_min: 0.2047
    l0_max: 0.5231
    singularity_epsilon: 0.05
    hip_sign: [1.0, -1.0]
    knee_sign: [-1.0, 1.0]
    c1: 2.4103
    c2: -1.6790
    # VMC 增益
    kp_theta: 60.0
    kd_theta: 3.0
    kp_l0: 800.0
    kd_l0: 5.0  # 低阻尼爆发蹬伸 (原20)
    feedforward_force: 110.0  # 支撑前馈: 需 > 体重/腿(~91N), 否则无法起跳
    kp_roll: 40.0
    kd_roll: 2.0
    kp_wheel: 2.0
    kp_wheel_integral: 1.0
    wheel_integral_limit_ratio: 0.5
    wheel_ctrlrange: 10.0
    # 动作缩放
    action_scale_theta: 0.5
    action_scale_l0: 0.12  # 覆盖下蹲0.28~蹬伸0.50范围
    action_scale_vel: 10.0
    action_scale_roll: 0.3
    roll_default: [0.1, -0.1]
    wheel_sign: [1.0, -1.0]
    clip_actions: 1.0
    # SLIP-FSM 蹬伸相 VMC 增益 (覆盖 vmc.py 默认, PPO+VMC 版本调优)
    thrust_ff_scale: 3.5  # 强蹬伸前馈 (3.0->3.5: 更爆发蹬伸)
    thrust_kd_scale: 0.15  # 蹬伸低阻尼 (0.25->0.15: 更小腿长阻尼, 爆发伸展)
    # Full-action 参考混合: fb<1.0 使 SLIP-FSM 参考主导, 策略保留大部分权限但
    # 无法取消蹲→蹬时序 (基线 fb=1.0 时策略在下蹲相慢慢伸腿白拿 launch_rise,
    # 轮子不离地 air=2%。SRL+VMC 用 0.5 验证有效)。
    # v8: 0.7→0.5 — 策略对下蹲参考的对抗减小 (实测 v3 下蹲相 base_z 只到 0.52,
    # 策略在对抗压缩, 参考 L0→0.28 没执行到位)
    feedback_gain: 0.5
    # v8: 加长下蹲相 0.35→0.50s — VMC 压缩腿需 ~40 步 (实测), 0.35s 内蹲不到位
    # 就切蹬伸 → 深蹲不足 → 跳高卡 0.16m
    fsm_crouch_time: 0.50
    # 下蹲相 L0 上界 (物理 m): 超过视为提前伸腿, anti_early_extend 惩罚
    crouch_upper_bound: 0.38

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -60.0
    orientation: -5.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.015
    leg_mirror: -12.0
    tsk: -2.0
    alive: 1.0
    jump_height: 15.0
    jump_land: 250.0  # v9: 真实跳高奖励 (落地按腾空峰值) — 逼真跳, 与 launch_rise 降幅配套
    crouch_prep: 4.0
    landing_soft: 15.0
    landing_recovery: 8.0  # 落地后恢复稳定站立 (双轮着地+直立+高度) — 修复前遗漏, 其他三算法均有
    wheel_air_time: 20.0
    launch_rise: 15.0  # v9: 35→15 大幅降低 — v8 实测 FSM 蹬伸相"接地慢伸"刷 launch_rise (不腾空)
    crouch_depth: 15.0  # v8: 8→15 深蹲回报加强, 逼出真正下蹲蓄力
    anti_loiter: 12.0
    lean_forward: 5.0
    anti_early_extend: 8.0  # 下蹲相提前伸腿惩罚 (堵住慢伸 exploit)
  tracking_sigma: 0.3
  base_height_target: 0.55
  jump_height_target: 1.0
  crouch_height_target: 0.40
  max_tilt_deg: 45.0
  min_base_height: 0.15
  jump_curriculum_start: 0
  jump_curriculum_end: 0  # 对比公平: 四版本统一无热身, 立即全开跳跃
