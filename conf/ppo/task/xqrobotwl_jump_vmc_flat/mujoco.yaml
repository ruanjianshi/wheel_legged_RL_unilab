# @package _global_
# =============================================================================
# XqRobotWL PPO+VMC 跳跃训练配置 (MuJoCo 后端)
# 与纯 PPO jump 相同的奖励/命令/预算, 但策略输出虚拟腿变量, 由 VMC 转关节力矩。
# 5D 命令: [vx, vy, vyaw, tsk, jump_trigger]
# 8D 动作: [roll_L, theta_L, L0_L, roll_R, theta_R, L0_R, wheel_L, wheel_R]
# =============================================================================
training:
  task_name: XqRobotWLJumpVMC
  sim_backend: mujoco
  play_steps: 300
  play_env_num: 1
  render_spacing: 0.0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0
  camera_elevation: -15.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.005
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.6
    wheel_action_scale: 10.0
    clip_actions: 1.0
  commands:
    vel_limit:
      - [-0.3, 0.0, -0.5, -0.1, 0]
      - [0.3, 0.0, 0.5, 0.1, 1]
    resampling_time: 4.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false
  vmc:
    # 虚拟腿运动学 (标定自 tools/xqrobotwl/calibrate_xqrobotwl_vmc.py)
    l1: 0.30053
    l2: 0.30070
    offset: -0.00003
    theta0_offset: 0.0747
    l0_offset: 0.3669
    l0_min: 0.2047
    l0_max: 0.5231
    singularity_epsilon: 0.05
    hip_sign: [1.0, -1.0]
    knee_sign: [-1.0, 1.0]
    c1: 2.4103
    c2: -1.6790
    # VMC 增益
    kp_theta: 60.0
    kd_theta: 3.0
    kp_l0: 800.0
    kd_l0: 5.0  # 低阻尼爆发蹬伸 (原20)
    feedforward_force: 110.0  # 支撑前馈: 需 > 体重/腿(~91N), 否则无法起跳
    kp_roll: 40.0
    kd_roll: 2.0
    kp_wheel: 2.0
    kp_wheel_integral: 1.0
    wheel_integral_limit_ratio: 0.5
    wheel_ctrlrange: 10.0
    # 动作缩放
    action_scale_theta: 0.5
    action_scale_l0: 0.12  # 覆盖下蹲0.28~蹬伸0.50范围
    action_scale_vel: 10.0
    action_scale_roll: 0.3
    roll_default: [0.1, -0.1]
    wheel_sign: [1.0, -1.0]
    clip_actions: 1.0

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -60.0
    orientation: -5.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.015
    leg_mirror: -12.0
    tsk: -2.0
    alive: 1.0
    jump_height: 12.0
    crouch_prep: 4.0
    landing_soft: 15.0
    wheel_air_time: 20.0
    launch_rise: 40.0  # 实际升高奖励 (替换 vz²thrust: 推而不起=0)
    crouch_depth: 8.0  # 深蹲回报 (原4): 逼出"先蹲后蹬"
    anti_loiter: 12.0
    lean_forward: 5.0
  tracking_sigma: 0.3
  base_height_target: 0.55
  jump_height_target: 1.0
  crouch_height_target: 0.40
  max_tilt_deg: 45.0
  min_base_height: 0.15
  jump_curriculum_start: 0
  jump_curriculum_end: 0  # 对比公平: 四版本统一无热身, 立即全开跳跃
