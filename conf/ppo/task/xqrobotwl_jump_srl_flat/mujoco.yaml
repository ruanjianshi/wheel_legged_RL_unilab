# @package _global_
# =============================================================================
# XqRobotWL Wheeled-SRL 跳跃训练配置 (MuJoCo 后端)
# 5D 命令: [vx, vy, vyaw, tsk, jump_trigger]
#
# Wheeled-SRL 改进:
# - SLIP模型六状态FSM前馈 + PPO反馈融合
# - 轮地速度匹配奖励
# - 扩展观测含 fsm_state + jump_phase
# - 三阶段预热: 0-3000纯站立, 3000-6000跳跃斜坡, 6000+全开
# =============================================================================
training:
  task_name: XqRobotWLJumpSRLFlat
  run_suffix: ""
  sim_backend: mujoco
  play_steps: 300
  play_env_num: 1
  render_spacing: 0.0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0
  camera_elevation: -15.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
    default:
      - policy
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.005
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.6
    wheel_action_scale: 10.0
    clip_actions: 100.0
  commands:
    vel_limit:
      - [-0.3, 0.0, -0.5, -0.1, 0]
      - [0.3, 0.0, 0.5, 0.1, 1]
    resampling_time: 4.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -60.0
    orientation: -5.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.015
    leg_mirror: -12.0
    tsk: -2.0
    alive: 1.0
    jump_height: 25.0  # v4: 15→25 — 恢复跳高 (原 15 被落地/防漂移奖励压过)
    crouch_prep: 8.0
    landing_soft: 8.0          # 落地缓冲 (门控到真实腾空落地, 防白嫖)
    wheel_ground_matching: 8.0  # 轮地速度匹配 (落地/飞行) — 修复键名与fn对齐, 降幅避免惩罚爆炸
    landing_recovery: 4.0      # v4: 8→4 — 原 8 使策略偏向"安全低跳" (跳高 0.57→0.23), 恢复稳定已由其他项保持
    anti_drift: -2.0           # v4: -4→-2 — 放宽, 允许跳跃自然前冲, 恢复跳高
    vertical_thrust: 30.0
    crouch_depth: 4.0  # v4: 6→4 — 降低深蹲奖励, 防下蹲过深 (实测蹲到 0.24 "倒地")
    action_magnitude: -0.1
    height_progress: 20.0  # v4: 10→20 — 强化"跳到新高度"激励, 恢复跳高
    lean_forward: 3.0
  tracking_sigma: 0.3
  base_height_target: 0.55
  jump_height_target: 1.0
  crouch_height_target: 0.40
  max_tilt_deg: 45.0
  min_base_height: 0.15
  jump_curriculum_start: 0
  jump_curriculum_end: 0  # 无预热，直接全开跳跃
  # 落地恢复窗口 (真实腾空→落地后计时, 用于 landing_soft/landing_recovery 门控)
  landing_window: 30
  min_grounded_steps: 5
  # 消融实验
  feedback_gain: 0.15  # SLIP FSM 前馈混合比 (no_fsm消融=0.0)
  ablation_mode: full
