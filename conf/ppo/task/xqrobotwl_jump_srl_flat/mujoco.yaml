# @package _global_
# =============================================================================
# XqRobotWL Wheeled-SRL 跳跃训练配置 (MuJoCo 后端)
# 5D 命令: [vx, vy, vyaw, tsk, jump_trigger]
#
# Wheeled-SRL 改进:
# - SLIP模型六状态FSM前馈 + PPO反馈融合
# - 轮地速度匹配奖励
# - 扩展观测含 fsm_state + jump_phase
# - 三阶段预热: 0-3000纯站立, 3000-6000跳跃斜坡, 6000+全开
# =============================================================================
training:
  task_name: XqRobotWLJumpSRLFlat
  run_suffix: ""
  sim_backend: mujoco
  play_steps: 300
  play_env_num: 1
  render_spacing: 0.0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0
  camera_elevation: -15.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.008
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.7
    wheel_action_scale: 10.0
    clip_actions: 100.0
  commands:
    vel_limit:
      - [-0.3, 0.0, -0.5, -0.1, 0]
      - [0.3, 0.0, 0.5, 0.1, 1]
    resampling_time: 4.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false
  ablation_mode: "full"

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -2.0
    orientation: -2.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.015
    leg_mirror: -2.0
    tsk: -2.0
    alive: 1.0
    jump_height: 20.0
    crouch_prep: 6.0
    landing_soft: 4.0
    wheel_ground_matching: 20.0
    vertical_thrust: 12.0
    crouch_depth: 6.0
    action_magnitude: -0.02
  tracking_sigma: 0.3
  base_height_target: 0.65
  jump_height_target: 1.0
  crouch_height_target: 0.40
  max_tilt_deg: 45.0
  min_base_height: 0.15
  jump_warmup_steps: 3000
  feedback_gain: 0.2
