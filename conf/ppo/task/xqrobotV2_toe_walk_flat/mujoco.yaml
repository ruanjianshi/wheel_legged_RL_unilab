# @package _global_
# =============================================================================
# XqRobotV2 点足行走 PPO 训练 (正弦轨迹跟踪, 参考 HumanoidSW2)
# 时钟驱动交替迈步参考轨迹, RL 学习跟踪+修正
# =============================================================================
training:
  task_name: XqRobotV2ToeWalkFlat
  sim_backend: mujoco
  play_steps: 600
  play_env_num: 1

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0

algo:
  num_envs: 1024
  num_steps_per_env: 25
  max_iterations: 5000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.002
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.005
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.3                    # 修正量缩放 (参考轨迹已提供基础)
    wheel_action_scale: 10.0
    clip_actions: 100.0
  commands:
    # Stage 1: 原地踏步 - 速度指令接近零
    vel_limit:
      - [-0.05, -0.05, -0.05, -0.05]
      - [0.05, 0.05, 0.05, 0.05]
    resampling_time: 6.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 0.0                    # 原地踏步, 不追速度
    tracking_ang_vel: 0.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -5.0
    orientation: -10.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.005
    leg_mirror: -0.5
    tsk: -2.0
    hip_roll: -2.0
    wheel_symmetry: -0.5
    feet_distance: -1.0
    alive: 1.0
    ref_tracking: 2.0                        # 强化: 跟正弦抬腿
    swing_lift: 5.0                          # 强化: 膝盖必须收
    wheel_balance: 3.0                       # 轮子稳住机身
  tracking_sigma: 0.3
  base_height_target: 0.65
  cycle_time: 0.5                      # 步态周期 0.5s
  ref_scale: 0.12                     # 参考轨迹幅值(加大抬腿)
  max_tilt_deg: 45.0
  min_base_height: 0.15
