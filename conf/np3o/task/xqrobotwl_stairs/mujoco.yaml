# @package _global_
# =============================================================================
# XqRobotWL 楼梯专项训练 — 移植 Tita RL NP3O 设计
# 参考: /home/robot/xiaoq/projects/tita_rl/configs/tita_constraint_config.py
# =============================================================================
# 与参考项目的对齐逻辑:
#   奖励: tracking + penalties, 无显式抬腿/爬楼 (collision 惩罚替代)
#   地形: 100% 楼梯, 8 级课程 (走远升级/走近降级)
#   命令: resampling_time=10s, 无速度课程
#   观测: empirical_normalization=true
#   DR:   mass/com 开启
#   超参: 与 Tita PPOCfg 一致 (lr=1e-3, entropy=0.01, kl=0.01, grad_norm=0.01, noise=1.0)
# =============================================================================
training:
  task_name: XqRobotWLStairs
  sim_backend: mujoco
  play_steps: 500
  play_env_num: 16
  render_spacing: 0.0
  cam_tracking: true
  cam_tracking_env_idx: 0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  use_env_visual_model: false

algo:
  num_envs: 1024
  num_steps_per_env: 25
  max_iterations: 10000
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic

env:
  control_config:
    action_scale: 0.35
    wheel_action_scale: 8.0
    clip_actions: 100.0
    action_smoothing: 0.2
  commands:
    vel_limit:
      - [-1.0, 0.0, -1.5, -0.1, 0.40]
      - [1.0, 0.0, 1.5, 0.1, 0.90]
    resampling_time: 10.0
  terrain_scan:
    enabled: true
    hfield_name: terrain_hfield
    geom_name: floor
  termination_config:
    terrain_out_of_bounds: true
    terrain_distance_buffer: 3.0
  domain_rand:
    randomize_base_mass: true
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: true
    randomize_leg_length: false
  curriculum:
    enabled: false

reward:
  only_positive_rewards: false
  scales:
    tracking_lin_vel: 4.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.05
    base_height: -5.0
    orientation: -8.0
    joint_action_rate: -0.1
    wheel_action_rate: -0.005
    similar_calf: -1.0
    hip_roll: -4.0
    wheel_symmetry: -0.5
    tsk: -2.0
    feet_distance: -1.0
    collision: -1.0
    alive: 0.0
  tracking_sigma: 0.15
  base_height_target: 0.55
  max_tilt_deg: 60.0
  min_base_height: 0.20
