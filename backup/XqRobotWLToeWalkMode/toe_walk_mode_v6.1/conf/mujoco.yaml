# @package _global_
# =============================================================================
# XqRobotWL 双模式点足行走 PPO — 站立 ⇄ 点足抬腿 (mode 命令通道切换)
# commands 5D: [vx, vy, vyaw, tsk, mode]  mode∈{0站立, 1点足抬腿}
# 课程: Stage1 (0-2k) 纯站立 → Stage2 (2k-5k) 纯抬腿 → Stage3 (5k-10k) 随机切换
# 新增: stand_still (站立微动) + lift_symmetry (L/R 抬腿对称, 防单侧塌缩)
# =============================================================================
training:
  task_name: XqRobotWLToeWalkMode
  sim_backend: mujoco
  play_steps: 600
  play_env_num: 1

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_distance: 4.0

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 10000
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    activation: elu
    actor_hidden_dims: [512, 512, 256, 128]
    critic_hidden_dims: [512, 512, 256, 128]
    init_noise_std: 0.3  # v3: 0.4→0.3, 减少探索抖动撞终止阈值
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 0.005
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.005
    max_grad_norm: 1.0

env:
  control_config:
    action_scale: 0.18  # 平缓动作 (与 toe_walk 07-28 配方一致)
    wheel_action_scale: 10.0
    clip_actions: 100.0
  max_episode_seconds: 10.0
  commands:
    # 5D: [vx, vy, vyaw, tsk, mode]
    vel_limit:
      - [-0.3, -0.1, -0.3, -0.1, 0.0]
      - [0.3, 0.1, 0.3, 0.1, 1.0]
    resampling_time: 6.0
  curriculum:
    enabled: false
  domain_rand:
    randomize_base_mass: false
    randomize_ground_friction: false
    randomize_kp: false
    randomize_kd: false
    random_com: false
    randomize_leg_length: false

reward:
  only_positive_rewards: false
  scales:
    # ── 两模式共项 ──
    tracking_lin_vel: 4.0
    tracking_ang_vel: 2.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.3
    base_height: -100.0
    orientation: -30.0
    joint_action_rate: -0.08
    wheel_action_rate: -0.001
    leg_mirror: -0.2
    tsk: -2.0
    hip_roll: -0.5
    alive: 1.0
    # ── mode=1 抬腿专用 (mode=0 时权重×0) ──
    # v6 双层考核:
    #   * phase_swing_lift 30 逐时密集奖 (摆动窗内该侧轮离地立即给, 提供梯度信号)
    #   * window_penalty 500 窗级罚 (窗结束仍未离过地 → -500 一次)
    #   经济性: 双侧完美 +1500/周期; 单侧 750-500=+250 (被迫另一侧至少闪抬一次免罚); 不抬 -1000/周期
    phase_swing_lift: 30.0
    window_lift: 0.0       # 窗级奖移除 (逐时奖已够)
    window_penalty: 500.0
    phase_knee_lift: 15.0  # 门控: 当前摆动窗已离地才计 (防深弯膝刷分)
    phase_knee_stance: 5.0
    phase_stance_penalty: 5.0
    feet_regulation: 2.0
    # ── mode=0 站立专用 (mode=1 时权重×0) ──
    stand_still: -5.0   # 零指令时关节回默认位姿 (微动平衡)
    # ── 全模式: 抬腿对称性 (L/R 滑动均值差惩罚, 防单侧塌缩) ──
    lift_symmetry: -20.0
  tracking_sigma: 0.3
  base_height_target: 0.55
  cycle_time: 0.7
  use_reference: false
  max_tilt_deg: 90.0
  min_base_height: 0.15
  # ── 模式课程 (iter): Stage1 纯站立, Stage2 纯抬腿, Stage3 自由切换 ──
  # v2: [2000,5000]→[1800,5000] 站立学得快(1200iter已ep_len958), 压缩站立给抬腿
  mode_curriculum_iters: [1800, 5000]
  symmetry_decay: 0.98